<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farm Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="card form">
      <h1>Farm Records</h1>
      <p id="config-warning" class="warning" hidden>
        The app isn't connected yet. Open <code>config.js</code> and paste in your Supabase URL and key.
      </p>
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <h1>Farm Records</h1>
      <nav>
        <button data-view="home">Home</button>
        <button data-view="order">Water order</button>
        <button data-view="fields">Fields</button>
        <button data-view="crops">Crops</button>
        <button data-view="map">Map</button>
        <button data-view="setup">Setup</button>
      </nav>
      <button id="signout" class="ghost">Sign out</button>
    </header>
    <main id="view"></main>
  </div>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
