<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headgate · Three Point Farms</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Headgate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f4d2b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css?v=202610300352">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="card form">
      <img class="login-logo" src="assets/logo.png" alt="Three Point Farms">
      <p class="login-sub">Headgate</p>
      <p id="config-warning" class="warning" hidden>
        The app isn't connected yet. Open <code>config.js</code> and paste in your Supabase URL and key.
      </p>
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#" data-home aria-label="Three Point Farms — home">
        <img src="assets/mark.png" alt="">
        <span class="brand-text"><b>Three Point</b><small>Farms</small></span>
      </a>
      <nav>
        <button data-view="home"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg><span>Home</span></button>
        <button data-view="order"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></svg><span>Water order</span></button>
        <button data-view="fields" class="nav-extra">Fields</button>
        <button data-view="crops" class="nav-extra">Crops</button>
        <button data-view="map" class="nav-extra">Map</button>
        <button data-view="chem" class="nav-extra">Chemical</button>
        <button data-view="work"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 13 2 2 4-4"/></svg><span>Work</span></button>
        <button data-view="maint"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3.6 17.1a1.5 1.5 0 0 0 2.1 2.1l5.7-5.7a4 4 0 0 0 5.1-5.4l-2.5 2.5-2.1-.5-.5-2.1z"/></svg><span>Maintenance</span></button>
        <button data-view="setup" class="nav-extra">Setup</button>
        <button data-view="tools" class="nav-extra">Tools</button>
        <button data-more class="nav-more" aria-expanded="false"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
      </nav>
      <span class="row"><button id="account" class="ghost">Account</button>
      <button id="signout" class="ghost">Sign out</button></span>
    </header>
    <main id="view"></main>
  </div>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js?v=202610300352"></script>
</body>
</html>
