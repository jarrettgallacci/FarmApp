<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headgate · Three Point Farms</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Headgate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f4d2b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css?v=202610232243">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="card form">
      <img class="login-logo" src="assets/logo.png" alt="Three Point Farms">
      <p class="login-sub">Headgate</p>
      <p id="config-warning" class="warning" hidden>
        The app isn't connected yet. Open <code>config.js</code> and paste in your Supabase URL and key.
      </p>
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#" data-home aria-label="Three Point Farms — home">
        <img src="assets/mark.png" alt="">
        <span class="brand-text"><b>Three Point</b><small>Farms</small></span>
      </a>
      <nav>
        <button data-view="home">Home</button>
        <button data-view="order">Water order</button>
        <button data-view="fields">Fields</button>
        <button data-view="crops">Crops</button>
        <button data-view="map">Map</button>
        <button data-view="chem">Chemical</button>
        <button data-view="work">Work</button>
        <button data-view="maint">Maintenance</button>
        <button data-view="setup">Setup</button>
        <button data-view="tools">Tools</button>
      </nav>
      <span class="row"><button id="account" class="ghost">Account</button>
      <button id="signout" class="ghost">Sign out</button></span>
    </header>
    <main id="view"></main>
  </div>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js?v=202610232243"></script>
</body>
</html>
